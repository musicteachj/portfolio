name: CI and deploy to AWS

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Dummy values so the build and tests never touch the real EmailJS account.
      NUXT_PUBLIC_EMAILJS_SERVICE_ID: ci_service_id
      NUXT_PUBLIC_EMAILJS_TEMPLATE_ID: ci_template_id
      NUXT_PUBLIC_EMAILJS_PUBLIC_KEY: ci_public_key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Typecheck wipes .output, so it runs before generate.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Generate static site
        run: npm run generate

      - name: Output tests
        run: npm run test:output

      - name: SEO check
        run: npm run check-seo

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      NUXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
      NUXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
      NUXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check EmailJS secrets are set
        run: |
          missing=0
          for name in NUXT_PUBLIC_EMAILJS_SERVICE_ID NUXT_PUBLIC_EMAILJS_TEMPLATE_ID NUXT_PUBLIC_EMAILJS_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Check the matching VITE_EMAILJS_* repository secret."
              missing=1
            fi
          done
          exit $missing

      - name: Generate static site
        run: npm run generate

      - name: SEO check
        run: npm run check-seo

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync files to S3
        run: node scripts/deploy-s3.mjs .output/public s3://jameslittlefield.net

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
