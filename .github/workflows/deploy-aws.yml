name: CI and deploy to AWS

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's run in progress. Every other
# run gets a group of its own, so pushes to main and dev are never canceled or held here.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A full run takes about 13 minutes.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A push to main builds the site that ships, so it uses the real EmailJS values from the
      # repository secrets and stops if any is empty. Every other run uses dummy values. The
      # e2e tests block every request to EmailJS either way, so no test sends an email.
      - name: Choose EmailJS values
        env:
          RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          SERVICE_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.VITE_EMAILJS_SERVICE_ID || '' }}
          TEMPLATE_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.VITE_EMAILJS_TEMPLATE_ID || '' }}
          PUBLIC_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.VITE_EMAILJS_PUBLIC_KEY || '' }}
        run: |
          if [ "$RELEASE" = true ]; then
            missing=0
            for name in SERVICE_ID TEMPLATE_ID PUBLIC_KEY; do
              if [ -z "${!name}" ]; then
                echo "::error::The VITE_EMAILJS_$name repository secret is empty."
                missing=1
              fi
            done
            [ "$missing" = 0 ] || exit 1
          else
            SERVICE_ID=ci_service_id TEMPLATE_ID=ci_template_id PUBLIC_KEY=ci_public_key
          fi
          {
            echo "NUXT_PUBLIC_EMAILJS_SERVICE_ID=$SERVICE_ID"
            echo "NUXT_PUBLIC_EMAILJS_TEMPLATE_ID=$TEMPLATE_ID"
            echo "NUXT_PUBLIC_EMAILJS_PUBLIC_KEY=$PUBLIC_KEY"
          } >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      # Typecheck wipes .output, so it runs before generate.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Generate static site
        run: npm run generate

      - name: Output tests
        run: npm run test:output

      - name: SEO check
        run: npm run check-seo

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      # The deploy job uploads exactly this tested build, rather than building again.
      - name: Save the tested site for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: .output/public/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      # For the deploy script only. It needs Node but no npm packages.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Download the tested site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: .output/public

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync files to S3
        run: node scripts/deploy-s3.mjs .output/public s3://jameslittlefield.net

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
