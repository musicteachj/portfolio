# Monthly dependency updates, one grouped pull request per ecosystem, into dev like any
# other change. The build-and-test check must pass before one can merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
